name: PATLEP - Build NewPipe Voice

on:
  push:
    branches:
      - patlep-voice-dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: patlep-newpipe-voice-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android:
    name: Build and test Android app
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout patlep-voice-dev
        uses: actions/checkout@v6
        with:
          ref: patlep-voice-dev

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build APK, run lint and JVM unit tests
        run: ./gradlew assembleContinuous lintContinuous testDebugUnitTest --stacktrace -DskipFormatKtlint

      - name: Upload continuous APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: NewPipe-Voice-patlep-voice-dev
          path: app/build/outputs/apk/continuous/*.apk
          if-no-files-found: error
          retention-days: 14
